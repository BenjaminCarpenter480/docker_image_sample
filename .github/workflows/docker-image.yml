name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted
    services:
      buildkitd:
        image: moby/buildkit:rootless
        options: >-
          --name buildkitd-service
          --security-opt seccomp=unconfined
          --security-opt apparmor=unconfined
          --security-opt systempaths=unconfined
         env:
          BUILDKITD_FLAGS: --oci-worker-no-process-sandbox

        
    steps:
    - name: Checkout 
      uses: actions/checkout@v4
    - name: Setup Docker
      uses: docker/setup-buildx-action@v3
      with:
        driver: remote
        endpoint: docker-container://buildkitd-service
      run: |
            mkdir -p ~/.docker
            echo "{\"auths\":{\"$HARBOR_HOST\":{\"username\":\"$HARBOR_USERNAME\" ,\"password\":\"$HARBOR_PASSWORD\"}}}" > ~/.docker/config.json
    
    - name: Build the Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: $HARBOR_HOST/$HARBOR_PROJECT/hello-world:latest
