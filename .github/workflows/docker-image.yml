name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  # Map your GitHub Repository Secrets / Variables here
  HARBOR_HOST: ${{ vars.HARBOR_HOST || 'registry.eidf.ac.uk' }}
  HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT || 'eidf177' }}
  CONTAINER_NAME: buildkitd-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Rootless BuildKit daemon
        run: |
          docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
          docker run -d --rm \
            --name "${CONTAINER_NAME}" \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            -e BUILDKITD_FLAGS="--oci-worker-no-process-sandbox" \
            moby/buildkit:rootless

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: docker-container://${{ env.CONTAINER_NAME }}

      - name: Log in to Harbor Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push the Docker image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.HARBOR_HOST }}/${{ env.HARBOR_PROJECT }}/hello-world:latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Set image digest
        id: get-digest
        run: |
          echo "IMAGE_DIGEST=${{ env.HARBOR_HOST }}/${{ env.HARBOR_PROJECT }}/hello-world:latest@${{ steps.build-image.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Sign and verify the images with GitHub OIDC Token
        run: |
          cosign sign --yes ${{ steps.get-digest.outputs.IMAGE_DIGEST }} \
            --annotations "com.github.actions.workflow=${{ github.workflow }}" \
            --annotations "com.github.actions.run_id=${{ github.run_id }}" \
            --annotations "com.github.actions.run_number=${{ github.run_number }}" \
            --annotations "com.github.actions.job=${{ github.job }}" \
            --annotations "com.github.actions.actor=${{ github.actor }}" \
            --annotations "com.github.actions.repository=${{ github.repository }}" \
            --annotations "com.github.actions.ref=${{ github.ref }}" \
            --annotations "com.github.actions.sha=${{ github.sha }}"

      - name: Stop Rootless BuildKit daemon
        if: always()
        run: docker stop "${CONTAINER_NAME}" || true
