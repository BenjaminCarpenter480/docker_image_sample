stages:
  - build
  - sign

variables:
  IMAGE_TAG: $CI_COMMIT_SHA
  IMAGE_NAME: $HARBOR_HOST/$HARBOR_PROJECT/hello-world
  IMAGE_URI: "$IMAGE_NAME:$IMAGE_TAG"

build-rootless:
  image:
    name: moby/buildkit:rootless
  stage: build
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$HARBOR_HOST\":{\"username\":\"$HARBOR_USERNAME\" ,\"password\":\"$HARBOR_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output type=image,name=$IMAGE_URI,push=true

sign-image-notation:
  stage: sign
  image: docker:dind-rootless
  variables:
    DOCKER_HOST: tcp://docker:2375
    NOTATION_VERSION: 1.3.2
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$HARBOR_HOST\":{\"username\":\"$HARBOR_USERNAME\" ,\"password\":\"$HARBOR_PASSWORD\"}}}" > ~/.docker/config.json

    # Install notation (https://notaryproject.dev/docs/user-guides/installation/cli/)
    - curl -LO https://github.com/notaryproject/notation/releases/download/v$NOTATION_VERSION/notation_$NOTATION_VERSION\_linux_amd64.tar.gz
    - curl -LO https://github.com/notaryproject/notation/releases/download/v$NOTATION_VERSION/notation_$NOTATION_VERSION\_checksums.txt
    - shasum --check notation_$NOTATION_VERSION\_checksums.txt

    # Login to the registry using notation
    - notation login -u $HARBOR_USERNAME -p $HARBOR_PASSWORD $HARBOR_HOST

  script:
    - notation ls $IMAGE_URI
    - notation sign $IMAGE_URI --key $COSIGN_PRIVATE_KEY
