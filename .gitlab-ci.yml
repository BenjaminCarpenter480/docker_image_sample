stages:
  - build

variables:
  BUILDKIT_PROGRESS: plain

build-image:
  image: moby/buildkit:rootless
  stage: build
  variables:
    BUILDKITD_FLAGS: "--debug"
    CI_DEBUG_TRACE: "true"
  before_script:
    - echo 'Doing the pre script'
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output type=image,name=registry.gitlab.com/$CI_PROJECT_PATH:latest,push=true
  only:
    - main

